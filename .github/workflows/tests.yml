name: Testes

# Econômico para repositório privado (cota gratuita do Actions): só Linux e só quando o código muda.
# Para testar também no Windows: Actions > Testes > Run workflow > marcar "windows".
on:
  push:
    branches: [main]
    paths: ["markinho/**", "tests/**", "requirements*.txt", "pyproject.toml", ".github/workflows/tests.yml"]
  workflow_dispatch:
    inputs:
      windows:
        description: "Testar também no Windows (conta 2× na cota)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event.inputs.windows == 'true' && '["ubuntu-24.04","windows-latest"]' || '["ubuntu-24.04"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Dependências do sistema (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 tesseract-ocr tesseract-ocr-por
      - name: Dependências Python
        run: pip install -r requirements-padrao.txt -r requirements-dev.txt
      - name: Testes e cobertura
        run: python -m pytest -q --cov --cov-report=term-missing:skip-covered --cov-report=html
      # Sigilo verificado: os testes de conversão rodam numa máquina SEM rede nenhuma (nem o Python nem o
      # Pandoc/Tesseract conseguem acessar a internet). Se algo tentar se conectar, falha aqui.
      - name: Sigilo — converter sem internet (rede desligada de verdade)
        if: runner.os == 'Linux'
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          unshare -rn python -m pytest -q -p no:cacheprovider tests/test_offline.py
      # Relatório de cobertura (abrir htmlcov/index.html): verde = testado, vermelho = sem teste
      - name: Guardar relatório de cobertura
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: cobertura-testes
          path: htmlcov/
          retention-days: 2
          if-no-files-found: ignore
