name: Instaladores

# Gera os instaladores das edições LEVE, PADRÃO e COMPLETA em Windows, macOS e Linux.
# - Manualmente: aba Actions > Instaladores > Run workflow (os arquivos ficam em "Artifacts" da execução,
#   guardados por 5 dias). Para economizar a cota gratuita, comece só com a edição "leve".
# - Ao criar uma tag v* (ex.: v3.0.0): gera as 3 edições e publica uma Release com todos os arquivos.
# Atenção (repositório privado, plano gratuito): 2.000 min/mês; macOS conta 10× e Windows 2×.
on:
  workflow_dispatch:
    inputs:
      editions:
        description: "Edições (separadas por vírgula): leve, padrao, completa"
        default: "leve"
      sistemas:
        description: "Sistemas (separados por vírgula): windows, linux, macos (o macOS gasta 10× a cota)"
        default: "windows,linux"
      mac_intel:
        description: "Gerar também para Mac Intel (mais 10× de cota)"
        type: boolean
        default: false
  push:
    tags: ["v*"]

# Segurança: por padrão os jobs só leem o repositório; só o job “release” pode publicar.
permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  PYTHONUTF8: "1"            # acentos e símbolos no console do Windows
  PYTHONIOENCODING: "utf-8"

jobs:
  setup:
    runs-on: ubuntu-24.04   # versão fixa (o ubuntu-latest muda sozinho)
    timeout-minutes: 5   # trava = para, sem gastar a cota
    outputs:
      editions: ${{ steps.e.outputs.editions }}
      sistemas: ${{ steps.e.outputs.sistemas }}
      macs: ${{ steps.e.outputs.macs }}
    steps:
      - id: e
        # os campos digitados entram por variável de ambiente (nunca colados no comando) e só
        # valores conhecidos passam
        env:
          IN_E: ${{ github.event.inputs.editions || 'leve,padrao,completa' }}
          IN_S: ${{ github.event.inputs.sistemas || 'windows,linux,macos' }}
          MAC_INTEL: ${{ github.event.inputs.mac_intel }}
          EVENT: ${{ github.event_name }}
        run: |
          # aceita maiúsculas, espaços e acento (ex.: "Padrão, Leve"); recusa valores desconhecidos
          tojson() { python3 -c 'import sys,json,unicodedata
          ok=set(sys.argv[1].split(","))
          t=unicodedata.normalize("NFKD",sys.stdin.read().lower()).encode("ascii","ignore").decode()
          v=[x.strip() for x in t.split(",") if x.strip()]
          bad=[x for x in v if x not in ok]
          if bad or not v: sys.exit("valor desconhecido: "+", ".join(bad or ["(vazio)"])+" (use: "+", ".join(sorted(ok))+")")
          print(json.dumps(v))' "$1"; }
          EJ=$(printf '%s' "$IN_E" | tojson leve,padrao,completa)
          SJ=$(printf '%s' "$IN_S" | tojson windows,linux,macos)
          echo "editions=$EJ" >> "$GITHUB_OUTPUT"
          echo "sistemas=$SJ" >> "$GITHUB_OUTPUT"
          if [ "$MAC_INTEL" = "true" ] || [ "$EVENT" = "push" ]; then
            echo 'macs=["macos-latest","macos-15-intel"]' >> "$GITHUB_OUTPUT"
          else
            echo 'macs=["macos-latest"]' >> "$GITHUB_OUTPUT"
          fi

  windows:
    needs: setup
    if: contains(needs.setup.outputs.sistemas, 'windows')
    strategy:
      fail-fast: false
      matrix:
        edition: ${{ fromJSON(needs.setup.outputs.editions) }}
    runs-on: windows-latest
    timeout-minutes: 90   # trava = para, sem gastar a cota
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: PyTorch para processador (COMPLETA)
        if: matrix.edition == 'completa'
        run: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - name: Dependências da edição
        run: pip install -r requirements-${{ matrix.edition }}.txt pyinstaller
      - name: Tesseract (OCR) embutido, com os idiomas da edição
        if: matrix.edition != 'leve'
        shell: pwsh
        run: |
          choco install tesseract -y --no-progress
          New-Item -ItemType Directory -Force packaging\vendor | Out-Null
          Copy-Item "C:\Program Files\Tesseract-OCR" packaging\vendor\tesseract -Recurse
          python packaging/build.py --edition ${{ matrix.edition }} tessdata
      - name: Programa e ZIP portátil
        run: python packaging/build.py --edition ${{ matrix.edition }} app zip
      - name: EXE portátil
        if: matrix.edition != 'completa'
        continue-on-error: true
        run: python packaging/build.py --edition ${{ matrix.edition }} onefile
      - name: Instalador .exe (Inno Setup)
        continue-on-error: true
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue) -and -not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }
          python packaging/build.py --edition ${{ matrix.edition }} inno
      - name: Instalador .msi (WiX)
        continue-on-error: true
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add -g WixToolset.UI.wixext/5.0.2
          python packaging/build.py --edition ${{ matrix.edition }} msi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: markinho-${{ matrix.edition }}-windows
          path: release/*
          if-no-files-found: error
          retention-days: 2   # repositório privado: só 500 MB para arquivos; baixe em até 2 dias

  macos:
    needs: setup
    if: contains(needs.setup.outputs.sistemas, 'macos')
    strategy:
      fail-fast: false
      matrix:
        edition: ${{ fromJSON(needs.setup.outputs.editions) }}
        os: ${{ fromJSON(needs.setup.outputs.macs) }}   # Apple Silicon; Intel só se pedido (ou na tag)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90   # trava = para, sem gastar a cota
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Dependências da edição
        run: pip install -r requirements-${{ matrix.edition }}.txt pyinstaller
      - name: App, ZIP e DMG
        run: python packaging/build.py --edition ${{ matrix.edition }} app zip dmg
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: markinho-${{ matrix.edition }}-${{ matrix.os }}
          path: release/*
          if-no-files-found: error
          retention-days: 2   # repositório privado: só 500 MB para arquivos; baixe em até 2 dias

  linux:
    needs: setup
    if: contains(needs.setup.outputs.sistemas, 'linux')
    strategy:
      fail-fast: false
      matrix:
        edition: ${{ fromJSON(needs.setup.outputs.editions) }}
    runs-on: ubuntu-22.04   # glibc mais antiga = funciona em mais distribuições
    timeout-minutes: 60   # trava = para, sem gastar a cota
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Dependências do sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libxcb-cursor0 file
      - name: PyTorch para processador (COMPLETA)
        if: matrix.edition == 'completa'
        run: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - name: Dependências da edição
        run: pip install -r requirements-${{ matrix.edition }}.txt pyinstaller
      - name: Programa, tar.gz e .deb
        run: python packaging/build.py --edition ${{ matrix.edition }} app zip deb
      - name: AppImage
        continue-on-error: true
        run: |
          curl -fsSL -o build/appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x build/appimagetool
          APPIMAGE_EXTRACT_AND_RUN=1 python packaging/build.py --edition ${{ matrix.edition }} appimage
      - name: Teste rápido do programa empacotado
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          build/dist-${{ matrix.edition }}/Markinho/markinho-cli --version
          build/dist-${{ matrix.edition }}/Markinho/markinho-cli --engines
          build/dist-${{ matrix.edition }}/Markinho/markinho-cli exemplos/relatorio.docx -t pdf -o /tmp/teste.pdf
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: markinho-${{ matrix.edition }}-linux
          path: release/*
          if-no-files-found: error
          retention-days: 2   # repositório privado: só 500 MB para arquivos; baixe em até 2 dias

  python:
    runs-on: ubuntu-24.04   # versão fixa (o ubuntu-latest muda sozinho)
    timeout-minutes: 15   # trava = para, sem gastar a cota
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install build && python packaging/build.py wheel
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: markinho-python
          path: release/*
          retention-days: 2

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    needs: [windows, macos, linux, python]
    runs-on: ubuntu-24.04   # versão fixa (o ubuntu-latest muda sozinho)
    timeout-minutes: 15   # trava = para, sem gastar a cota
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          path: release
          merge-multiple: true
      - run: ls -la release
      # Somas de verificação: quem baixa confere que o arquivo é o original (o Markinho não tem assinatura digital)
      - name: Somas SHA-256
        run: cd release && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@40c2ca6ddd77ba2a30bbea8f67409c0f76868d67  # v3
        with:
          files: release/*
          generate_release_notes: true
          body: |
            ## Escolha a edição

            | Edição | O que traz |
            |---|---|
            | **LEVE** | Motor nativo (PDF, Word, Excel, PowerPoint, HTML, EPUB…), correção de caracteres, imagens, exportação para DOCX/PDF/HTML/TXT, pedaços para IA, skill para assistentes de IA, servidor MCP, botão direito no Windows |
            | **PADRÃO** | LEVE + Pandoc (21 formatos de exportação) + OCR (português e inglês) com tratamento da imagem |
            | **COMPLETA** | PADRÃO + IA de layout (Docling, funciona offline) + MarkItDown + RapidOCR |

            **Qual escolher?**
            - **LEVE**: só arquivos digitais (Word, planilhas, PDFs gerados no computador). Não lê escaneados.
            - **PADRÃO**: também escaneados, fotos de documentos e prints (OCR em português e inglês, que endireita e gira páginas) e exportação para 21 formatos.
            - **COMPLETA**: PDFs difíceis (artigos, tabelas complicadas, fórmulas), com IA de layout que funciona sem internet. Instalador grande e conversão mais lenta.

            Todas as edições: interface em português, inglês e espanhol. Tudo roda no seu computador: nenhum documento é enviado para a internet.

            Para mudar de edição, instale a outra por cima: as configurações são mantidas.

            ## Escolha o arquivo

            | Sistema | Arquivo |
            |---|---|
            | Windows | `Markinho-<Edição>-…-windows-x64-setup.exe` (recomendado) · `.msi` (empresas) · `-portatil.zip` / `-portatil.exe` |
            | macOS | `Markinho-<Edição>-…-macos-arm64.dmg` (Apple Silicon) ou `…-macos-x64.dmg` (Intel). Na 1ª vez: botão direito > Abrir |
            | Linux | `markinho-<edição>_…_amd64.deb` (`sudo apt install ./arquivo.deb`) · `.AppImage` · `.tar.gz` |
            | Python | `pip install "markinho[padrao]"` ou `"markinho[completa]"` a partir do `.whl` |

            ## Conferir o arquivo baixado (opcional)

            O arquivo `SHA256SUMS.txt` traz a "impressão digital" de cada instalador. Para conferir no
            Windows, abra o PowerShell na pasta do download e rode `Get-FileHash .\nome-do-arquivo` —
            o resultado deve ser igual ao da lista. No Linux/macOS: `sha256sum -c SHA256SUMS.txt --ignore-missing`.

            Software livre (AGPL-3.0), fornecido "como está", sem garantia. Projeto pessoal, sem garantia de
            atualizações ou suporte.
